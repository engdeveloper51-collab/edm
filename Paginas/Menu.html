<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-MENU</title>
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/x-icon" href="logox/logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            background: #f5f5f5;
            overflow-x: hidden;
        }

        img,
        video,
        canvas,
        iframe {
            max-width: 100%;
        }


        /* TOPO */
        .top {
            height: 50px;
            background: linear-gradient(135deg, #f26522, #e55a1a);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .menu-btn i {
            display: flex;
            align-items: center;
        }

        .menu-btn:hover {
            transform: scale(1.1);
        }

        #titulo {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }

        /* DRAWER */
        .drawer {
            position: fixed;
            left: -240px;
            top: 50px;
            width: 240px;
            height: calc(100vh - 50px - 55px);
            background: #2d2d30;
            transition: left 0.3s ease;
            z-index: 999;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
        }

        .drawer.active {
            left: 0;
        }

        .drawer button {
            width: 100%;
            height: 48px;
            border: none;
            background: #2d2d30;
            color: #ffffff;
            text-align: left;
            padding-left: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, padding-left 0.2s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drawer button i {
            font-size: 18px;
            min-width: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .drawer button:hover i {
            transform: scale(1.15);
        }

        .drawer button:hover {
            background: #3e3e42;
            border-left-color: #f26522;
        }

        .drawer button.active {
            background: #3e3e42;
            color: #f26522;
            border-left-color: #f26522;
        }

        /* BOTÃO TERMINAR SESSÃO */
        .btn-terminar {
            background: #d32f2f !important;
            color: white !important;
            border-left: 3px solid #d32f2f !important;
            margin-top: auto;
            margin-bottom: 10px;
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
        }

        .btn-terminar i {
            font-size: 18px;
            min-width: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .btn-terminar:hover i {
            transform: scale(1.15);
        }

        .btn-terminar:hover {
            background: #b71c1c !important;
            border-left-color: #ff5252 !important;
        }

        /* CONTAINER DOS MENUS */
        .drawer-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .drawer-menus {
            flex: 1;
            overflow-y: auto;
        }

        /* SUBMENUS */
        .submenu-container {
            background: #1f1f1f;
            border-left: 5px solid #f26522;
            margin-left: 15px;
            margin-right: 10px;
            border-radius: 0 8px 8px 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .submenu-container.active {
            max-height: 300px;
        }

        .submenu-item {
            width: 100%;
            height: 45px;
            border: none;
            background: #1f1f1f;
            color: #ffffff;
            text-align: left;
            padding-left: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, padding-left 0.2s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .submenu-item i {
            font-size: 16px;
            min-width: 18px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .submenu-item:hover i {
            transform: scale(1.15);
        }

        .submenu-item:hover {
            background: #2a2a2a;
            color: #f26522;
            padding-left: 40px;
        }

        .submenu-item.active {
            background: #2a2a2a;
            color: #f26522;
            border-left-color: #f26522;
        }

        /* USER PROFILE SECTION */
        .user-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px 15px 10px;
            border-top: 1px solid #3e3e42;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #f26522;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(242, 101, 34, 0.3);
            transition: all 0.3s ease;
        }

        .user-avatar i {
            color: white;
        }

        .user-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(242, 101, 34, 0.5);
        }

        .user-greeting {
            color: #f26522;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .user-name {
            color: #f26522;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
            word-break: break-word;
            max-width: 200px;
        }

        /* MAIN */
        .main {
            margin-top: 50px;
            margin-bottom: 55px;
            padding: 0;
            width: 100%;
            height: calc(100vh - 105px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* CAROUSEL */
        .carousel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Overlay escuro - TODOS OS CAROUSELS */
        .carousel-slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
            pointer-events: none;
        }

        /* Controles do carousel */
        .carousel-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .carousel-dot.active {
            background: #f26522;
            transform: scale(1.3);
            border-color: #f26522;
        }

        .carousel-dot:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* Setas de navegação */
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(242, 101, 34, 0.7);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .carousel-arrow:hover {
            background: rgba(242, 101, 34, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-arrow.prev {
            left: 10px;
        }

        .carousel-arrow.next {
            right: 10px;
        }

        .main h2 {
            color: #333;
            margin-bottom: 10px;
            padding: 15px 15px 0 15px;
            position: relative;
            z-index: 5;
        }

        .main p {
            color: #666;
            padding: 0 15px;
            position: relative;
            z-index: 5;
        }

        .main-content {
            flex: 1;
            overflow: hidden;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .main-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* CONTEÚDO VAZIO */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        .empty-state p {
            font-size: 20px;
            color: white;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.9;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* BOTTOM NAV */
        .bottom {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .bottom button {
            background: none;
            border: none;
            color: #f26522;
            font-size: 12px;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .bottom button:hover {
            color: #ff8c42;
        }

        .bottom button.active {
            color: #f26522;
        }

        /* Estilo para ícones dos botões de baixo - Laranja */
        .bottom button span {
            color: #f26522;
        }

        .bottom button i {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .bottom button:hover i {
            transform: scale(1.15);
        }

        .bottom button:hover span {
            color: #ff8c42;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            #titulo {
                font-size: 16px;
            }

            .drawer {
                width: 100%;
                left: -100%;
            }

            .carousel-arrow {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .carousel-arrow.prev {
                left: 5px;
            }

            .carousel-arrow.next {
                right: 5px;
            }

            .empty-state p {
                font-size: 16px;
            }

            .empty-state .icon {
                font-size: 60px;
            }

            .carousel-controls {
                bottom: 10px;
            }

            .carousel-dot {
                width: 10px;
                height: 10px;
            }

            .bottom button span {
                font-size: 10px;
            }

            .submenu-container {
                margin-left: 10px;
                margin-right: 5px;
            }

            .submenu-item {
                padding-left: 20px;
            }

            .submenu-item:hover {
                padding-left: 30px;
            }

            .user-avatar {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }

            .user-greeting {
                font-size: 11px;
            }

            .user-name {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- TOPO -->
    <div class="top">
        <span class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></span>
        <span id="titulo">Sistema de Geo-Processmento</span>
        <div style="width: 24px;"></div>
    </div>

    <!-- MENU LATERAL -->
    <div class="drawer" id="drawer">
        <div class="drawer-content">
            <div class="drawer-menus">
                <button onclick="toggleSubmenu('cadastroSub', event)"><i class="fas fa-clipboard"></i> Cadastro</button>
                <div class="submenu-container" id="cadastroSub">
                    <button class="submenu-item" onclick="abrir('distritoCidade')"><i class="fas fa-city"></i> Distrito/Cidade</button>
                    <button class="submenu-item" onclick="abrir('bairro')"><i class="fas fa-building"></i> Bairro</button>
                    <button class="submenu-item" onclick="abrir('tipoAtivo')"><i class="fas fa-cube"></i> Tipo de Ativo</button>
                </div>
                <button onclick="abrir('baseDado')"><i class="fas fa-database"></i> Base de Dados</button>
                <button onclick="abrir('configUsuarios')"><i class="fas fa-cogs"></i> Config. Usuarios</button>
            </div>

            <!-- USER PROFILE SECTION -->
            <div class="user-profile">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-greeting">Olá,</div>
                <div class="user-name" id="userName">Usuário</div>
            </div>

            <!-- BOTÃO TERMINAR SESSÃO -->
            <button class="btn-terminar" onclick="terminarSessao()"><i class="fas fa-sign-out-alt"></i> Terminar Sessão</button>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div class="main" id="conteudo">
        <!-- CAROUSEL -->
        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide" id="slide-0"></div>
                <div class="carousel-slide" id="slide-1"></div>
                <div class="carousel-slide" id="slide-2"></div>
                <div class="carousel-slide" id="slide-3"></div>
            </div>

            <!-- Setas -->
            <button class="carousel-arrow prev" onclick="carouselPrev()"><i class="fas fa-chevron-left"></i></button>
            <button class="carousel-arrow next" onclick="carouselNext()"><i class="fas fa-chevron-right"></i></button>

            <!-- Dots indicadores -->
            <div class="carousel-controls">
                <span class="carousel-dot active" onclick="carouselGo(0)"></span>
                <span class="carousel-dot" onclick="carouselGo(1)"></span>
                <span class="carousel-dot" onclick="carouselGo(2)"></span>
                <span class="carousel-dot" onclick="carouselGo(3)"></span>
            </div>
        </div>

        <!-- Empty state (aparece quando não há conteúdo) -->
        <div class="empty-state" id="emptyState">
            <div class="icon"><i class="fas fa-bolt"></i></div>
            <p>Selecione uma opção no menu para começar</p>
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <div class="bottom">
        <button onclick="abrir('cadastroAtivo')" title="Cadastrar Activo"><i class="fas fa-clipboard-list"></i><span>Cadastrar Activo do S.E</span></button>
        <button onclick="abrir('Inspecção')" title="Inspecção"><i class="fas fa-magnifying-glass"></i><span>Inspecção</span></button>
        <button onclick="abrir('mapa')" title="Mapa"><i class="fas fa-map"></i><span>Mapa</span></button>
        <button onclick="abrir('relatorio')" title="Relatório"><i class="fas fa-chart-bar"></i><span>Relatório</span></button>
    </div>

    <script>
        (function () {
            const body = document.body;
            body.style.opacity = '0';
            body.style.transition = 'opacity 0.45s ease';

            window.addEventListener('load', () => {
                requestAnimationFrame(() => {
                    body.style.opacity = '1';
                });
            });

            window.navegarComTransicao = function (url) {
                body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = url;
                }, 380);
            };
        })();

        let currentSlide = 0;
        const totalSlides = 4;
        let autoplayInterval;

        // ==================== VERIFICAR SESSÃO ====================
        function verificarSessao() {
            const userId = sessionStorage.getItem("user_id");
            const userName = sessionStorage.getItem("user_name");

            if (!userId || !userName) {
                // Usuário não está logado, redirecionar para login
                navegarComTransicao("login.html");
                return false;
            }

            // Atualizar nome do usuário no menu com "Olá,"
            document.getElementById("userName").textContent = userName;
            console.log("✓ Sessão válida - Usuário:", userName);
            return true;
        }

        // Verificar sessão ao carregar a página
        window.addEventListener('load', verificarSessao);

        // Função para carregar imagem com detecção de extensão
        function carregarImagemSlide(slideId, caminhoSemExtensao) {
            const slide = document.getElementById(slideId);
            const extensoes = ['.JPG', '.jpg', '.jpeg', '.png', '.gif', '.webp'];
            let tentativa = 0;

            function normalizarCaminho(caminho) {
                if (!caminho) return caminho;
                if (/^(https?:)?\/\//i.test(caminho) || caminho.startsWith('/')) {
                    return caminho;
                }
                return `/${caminho.replace(/^\.\//, '').replace(/^\.\.\//, '')}`;
            }

            function tentar() {
                if (tentativa >= extensoes.length) {
                    console.warn(`Imagem não encontrada: ${caminhoSemExtensao}`);
                    slide.style.background = 'linear-gradient(135deg, #f26522, #e55a1a)';
                    return;
                }

                const caminhoBase = normalizarCaminho(caminhoSemExtensao);
                const caminhoCompleto = `${caminhoBase}${extensoes[tentativa]}`;
                const img = new Image();

                img.onload = function () {
                    console.log(`✓ Imagem carregada: ${caminhoCompleto}`);
                    slide.style.backgroundImage = `url('${caminhoCompleto}')`;
                };

                img.onerror = function () {
                    console.log(`✗ Tentando próxima extensão...`);
                    tentativa++;
                    tentar();
                };

                img.src = caminhoCompleto;
            }

            tentar();
        }

        function toggleDrawer() {
            const drawer = document.getElementById("drawer");
            drawer.classList.toggle("active");
        }

        function toggleSubmenu(submenuId, event) {
            event.stopPropagation();
            const submenu = document.getElementById(submenuId);
            submenu.classList.toggle("active");
        }

        function setTitulo(t) {
            document.getElementById("titulo").innerText = t;
        }

        function fecharDrawer() {
            document.getElementById("drawer").classList.remove("active");
        }

        // CAROUSEL FUNCTIONS
        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;

            document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function carouselNext() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
            resetAutoplay();
        }

        function carouselPrev() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
            resetAutoplay();
        }

        function carouselGo(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoplay();
        }

        function startAutoplay() {
            autoplayInterval = setInterval(() => {
                carouselNext();
            }, 5000);
        }

        function resetAutoplay() {
            clearInterval(autoplayInterval);
            startAutoplay();
        }

        // Carrega as imagens
        carregarImagemSlide('slide-0', 'Imag/pexels-pok-rie-33563-3829454');
        carregarImagemSlide('slide-1', 'Imag/ing1');
        carregarImagemSlide('slide-2', 'Imag/ing2');
        carregarImagemSlide('slide-3', 'Imag/ing3');

        // Inicia o carousel
        startAutoplay();

        function abrir(p) {
            fecharDrawer();

            const c = document.getElementById("conteudo");
            c.innerHTML = '';

            if (p === "cadastroAtivo") {
                setTitulo("📋 Cadastrar Activo do S.E");
                c.innerHTML = `<div class="main-content"><iframe src="cadastro.html"></iframe></div>`;

            } else if (p === "distritoCidade") {
                setTitulo("🏘️ Distrito/Cidade");
                c.innerHTML = `<div class="main-content"><iframe src="distritoCidade.html"></iframe></div>`;

            } else if (p === "bairro") {
                setTitulo("🏠 Bairro");
                c.innerHTML = `<div class="main-content"><iframe src="bairro.html"></iframe></div>`;

            } else if (p === "tipoAtivo") {
                setTitulo("📦 Tipo de Ativo");
                c.innerHTML = `<div class="main-content"><iframe src="tipoAtivo.html"></iframe></div>`;

            } else if (p === "baseDado") {
                setTitulo("🗄️ Base de Dados");
                c.innerHTML = `<div class="main-content"><iframe src="baseDado.html"></iframe></div>`;

            } else if (p === "configUsuarios") {
                setTitulo("⚙️ Config. Usuarios");
                const userName = sessionStorage.getItem("user_name");
                c.innerHTML = `<div class="main-content"><iframe src="configUsuarios.html?user=${encodeURIComponent(userName)}"></iframe></div>`;

            } else if (p === "Inspecção") {
                setTitulo("🔍 Inspecção");
                c.innerHTML = `<div class="main-content"><iframe src="Inspeccao.html"></iframe></div>`;

            } else if (p === "mapa") {
                setTitulo("🗺️ Mapa");
                c.innerHTML = `<div class="main-content"><iframe src="mapa.html"></iframe></div>`;

            } else if (p === "relatorio") {
                setTitulo("📊 Relatório");
                c.innerHTML = `<div class="main-content"><iframe src="reporte.html"></iframe></div>`;
            }

            clearInterval(autoplayInterval);
        }

        function voltarAoCarousel() {
            document.getElementById("conteudo").innerHTML = `
                <div class="carousel-container" id="carouselContainer">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-slide" id="slide-0"></div>
                        <div class="carousel-slide" id="slide-1"></div>
                        <div class="carousel-slide" id="slide-2"></div>
                        <div class="carousel-slide" id="slide-3"></div>
                    </div>
                    <button class="carousel-arrow prev" onclick="carouselPrev()">❮</button>
                    <button class="carousel-arrow next" onclick="carouselNext()">❯</button>
                    <div class="carousel-controls">
