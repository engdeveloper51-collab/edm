<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Carregamento...</title>
    <link rel="stylesheet" href="Paginas/responsive.css">
    <link rel="icon" type="image/x-icon" href="Imag/logo.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(255, 184, 108, 0.35), transparent 35%),
                        radial-gradient(circle at 80% 80%, rgba(242, 101, 34, 0.28), transparent 40%),
                        linear-gradient(135deg, #7a2500 0%, #d54e0f 45%, #f26522 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            animation: fadeIn 0.6s ease;
            overflow-x: hidden;
            position: relative;
        }

        img,
        video,
        canvas,
        iframe {
            max-width: 100%;
            height: auto;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            animation: slideUp 0.8s ease;
            position: relative;
            z-index: 2;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -40px;
            width: auto;
            height: auto;
            font-size: var(--size, 16px);
            line-height: 1;
            color: rgba(255, 204, 122, 0.9);
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
            opacity: 0.55;
            animation: floatParticle var(--duration, 12s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        .icon-container {
            margin-bottom: 40px;
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Imagem do ícone - AGORA VISÍVEL */
        .icon-container img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(255, 140, 0, 0.42));
            position: relative;
            z-index: 3;
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* Marcador de mapa animado - BACKGROUND */
        .map-marker {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* Pino do marcador - ESCONDIDO */
        .marker-pin {
            position: absolute;
            width: 60px;
            height: 80px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulsePin 2s ease-in-out infinite;
            display: none;
        }

        /* SVG do pino */
        .marker-pin svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* Círculos de propagação (ondas) */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #ffb347;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 18px rgba(255, 179, 71, 0.45);
        }

        .pulse-ring:nth-child(1) {
            animation: pulseRing 2s ease-out infinite;
            animation-delay: 0s;
        }

        .pulse-ring:nth-child(2) {
            animation: pulseRing 2s ease-out infinite;
            animation-delay: 0.6s;
        }

        .pulse-ring:nth-child(3) {
            animation: pulseRing 2s ease-out infinite;
            animation-delay: 1.2s;
        }

        h2 {
             margin-bottom: 30px;
    letter-spacing: 2px;
    font-size: 42px;
    font-family: "Arial Rounded MT Bold", Arial, sans-serif;
    font-weight: normal;
    color: #ffffff;
    animation: fadeIn 1s ease 0.2s both;
        }

        #status {
            margin-bottom: 25px;
            color: #ffd9a6;
            font-size: 20px;
            letter-spacing: 0.8px;
            font-weight: 400;
            animation: fadeIn 1s ease 0.6s both;
            min-height: 28px;
        }

        .progress-container {
            animation: fadeIn 1s ease 0.8s both;
        }

        .progress-bar {
            display: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8c00 0%, #f26522 50%, #ffb347 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            box-shadow: 0 0 20px rgba(242, 101, 34, 0.65);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffb347;
            animation: pulse 1.4s infinite;
            opacity: 0.6;
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.55);
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Animações */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes pulsePin {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes pulseRing {
            0% {
                width: 100%;
                height: 100%;
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                width: 200%;
                height: 200%;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        @keyframes floatParticle {
            0% {
                transform: translate3d(0, 0, 0) scale(0.9);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            80% {
                opacity: 0.45;
            }

            100% {
                transform: translate3d(var(--drift, 20px), -110vh, 0) scale(1.05);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                max-width: 85%;
            }

            h2 {
                font-size: 36px;
            }

            #status {
                font-size: 18px;
            }

            .progress-bar {
                display: none;
            }

            .icon-container {
                height: 150px;
            }

            .icon-container img {
                width: 100px;
                height: 100px;
            }

            .map-marker {
                width: 110px;
                height: 110px;
            }

            .marker-pin {
                width: 50px;
                height: 65px;
            }

            .loading-dots {
                gap: 10px;
            }

            .dot {
                width: 7px;
                height: 7px;
            }
        }
    </style>
</head>

<body>
    <div class="particles" aria-hidden="true">
        <span class="particle" style="left:4%; --size:14px; --duration:14s; --delay:0s; --drift:18px;">⚡</span>
        <span class="particle" style="left:11%; --size:18px; --duration:16s; --delay:2s; --drift:30px;">⚡</span>
        <span class="particle" style="left:19%; --size:13px; --duration:12s; --delay:1s; --drift:16px;">⚡</span>
        <span class="particle" style="left:27%; --size:20px; --duration:17s; --delay:4s; --drift:36px;">⚡</span>
        <span class="particle" style="left:36%; --size:16px; --duration:15s; --delay:0.5s; --drift:26px;">⚡</span>
        <span class="particle" style="left:44%; --size:14px; --duration:13s; --delay:3s; --drift:20px;">⚡</span>
        <span class="particle" style="left:53%; --size:18px; --duration:18s; --delay:1.5s; --drift:34px;">⚡</span>
        <span class="particle" style="left:62%; --size:12px; --duration:11s; --delay:2.8s; --drift:14px;">⚡</span>
        <span class="particle" style="left:71%; --size:19px; --duration:16s; --delay:3.5s; --drift:28px;">⚡</span>
        <span class="particle" style="left:79%; --size:16px; --duration:14s; --delay:0.8s; --drift:22px;">⚡</span>
        <span class="particle" style="left:88%; --size:14px; --duration:15s; --delay:2.2s; --drift:18px;">⚡</span>
        <span class="particle" style="left:95%; --size:18px; --duration:19s; --delay:4.2s; --drift:32px;">⚡</span>
    </div>

    <div class="container">
        <div class="icon-container" id="iconContainer">
            <!-- Marcador de mapa animado (background) -->
            <div class="map-marker">
                <!-- Ondas de propagação -->
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>

                <!-- Pino do marcador (escondido) -->
                <div class="marker-pin">
                    <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Corpo do pino -->
                        <path
                            d="M 12 0 C 6.477 0 2 4.477 2 10 C 2 16 12 32 12 32 C 12 32 22 16 22 10 C 22 4.477 17.523 0 12 0 Z"
                            fill="url(#pinGradient)" stroke="#ffffff" stroke-width="0.5" />
                        <!-- Círculo do centro -->
                        <circle cx="12" cy="10" r="5" fill="#ffffff" opacity="0.9" />
                        <circle cx="12" cy="10" r="3" fill="#ff4757" opacity="0.7" />
                    </svg>
                </div>
            </div>
            <!-- Ícone será carregado aqui -->
        </div>

        <h2>SIGEP PRO.</h2>
        <div class="progress-container">
            <p id="status">Inicializando...</p>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <script>
        // Carrega o ícone com caminho correto
        const iconContainer = document.getElementById('iconContainer');

        // Tenta diferentes extensões
        const extensoes = ['.png', '.jpg', '.jpeg', '.gif', '.webp', ''];
        let tentativas = 0;

        function tentarCarregarIcon(indice) {
            if (indice >= extensoes.length) {
                console.warn('Ícone não encontrado em nenhum formato');
                return;
            }

            const img = document.createElement('img');
            const extensao = extensoes[indice];

            // Caminho relativo correto
            img.src = `Imag/icon${extensao}`;
            img.alt = 'Ícone Sistema';

            img.onload = function () {
                const existingImg = iconContainer.querySelector('img');
                if (existingImg) {
                    existingImg.remove();
                }
                iconContainer.appendChild(img);
                console.log(`✓ Ícone carregado: Imag/icon${extensao}`);
            };

            img.onerror = function () {
                console.log(`✗ Tentando próxima extensão: ${extensoes[indice + 1]}`);
                tentarCarregarIcon(indice + 1);
            };
        }

        // Inicia tentativa de carregamento
        tentarCarregarIcon(0);

        let progress = 0;
        const progressBar = document.getElementById("progress");
        const statusText = document.getElementById("status");

        const messages = [
            "Inicializando...",
            "Carregando módulos...",
            "Conectando ao servidor...",
            "Preparando Páginas...",
            "Páginas Encontradas...",
            "Quase pronto...",
            "Aguarde Um Momento..."
        ];

        const interval = setInterval(() => {
            // Incremento progressivo mais suave
            if (progress < 30) {
                progress += Math.random() * 1.5;
            } else if (progress < 70) {
                progress += Math.random() * 0.8;
            } else {
                progress += Math.random() * 0.3;
            }

            // Limita a 95% antes de completar
            progress = Math.min(progress, 95);

            progressBar.style.width = progress + "%";

            if (progress < 20) statusText.textContent = messages[0];
            else if (progress < 40) statusText.textContent = messages[1];
            else if (progress < 60) statusText.textContent = messages[2];
            else if (progress < 80) statusText.textContent = messages[3];
            else statusText.textContent = messages[4];

            if (progress >= 95) {
                clearInterval(interval);

                // Completa a barra
                progressBar.style.width = "100%";
                statusText.textContent = "Iniciando...";

                // Fade out suave
                setTimeout(() => {
                    document.body.style.transition = "opacity 0.8s ease";
                    document.body.style.opacity = "0";

                    setTimeout(() => {
                        window.location.href = "Paginas/login.html";
                    }, 800);
                }, 500);
            }

        }, 90);
    </script>

</body>

</html>
