version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
    command: npm start

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./localhost+1.pem:/etc/nginx/certs/localhost+1.pem:ro
      - ./localhost+1-key.pem:/etc/nginx/certs/localhost+1-key.pem:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
